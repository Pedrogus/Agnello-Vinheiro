# Funcao: DNS interno (agnello.local) + DHCP simulado da rede Docker
# Rede: 172.28.0.0/24  |  Gateway: .1  |  DNS (este container): .2
domain=agnello.local
local=/agnello.local/
# Servico de autenticacao (JWT, login e validacao de token)
host-record=auth.agnello.local,172.28.0.10
# Microsservico de Pedidos
host-record=pedidos.agnello.local,172.28.0.11
# Microsservico de Estoque
host-record=estoque.agnello.local,172.28.0.12
# Servidor de CI/CD (Jenkins)
host-record=jenkins.agnello.local,172.28.0.20
# Proxy reverso com TLS (HTTPS)
host-record=proxy.agnello.local,172.28.0.30
# Ignora o DNS configurado dentro do container e usa so os servidores abaixo.
no-resolv
# Resolvedores publicos para nomes externos (ex.: google.com).
server=8.8.8.8
server=1.1.1.1
# Faixa dinamica .100 a .150, concessao de 12 horas.
dhcp-range=172.28.0.100,172.28.0.150,12h
# Opcao 3 = gateway entregue aos clientes.
dhcp-option=3,172.28.0.1
# Opcao 6 = servidor DNS entregue aos clientes (este container).
dhcp-option=6,172.28.0.2
# Registra cada consulta DNS (serve de evidencia/print no documento).
log-queries
# Envia o log para a saida do container (visivel com "docker logs").
log-facility=-
# Mantem o processo em primeiro plano; senao o container encerra.
keep-in-foreground