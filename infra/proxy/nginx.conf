# =====================================================================
# Vinheria Agnello - nginx.conf (proxy reverso com TLS)
# Local no repositorio: infra/proxy/nginx.conf
# Funcao: recebe HTTPS (porta 443), encerra o TLS e encaminha em HTTP
# para auth, pedidos e estoque pelos nomes do DNS interno.
# Montado em /etc/nginx/nginx.conf (somente leitura).
# =====================================================================

# Usuario dos processos de trabalho (o processo mestre abre as portas).
user  nginx;
worker_processes  auto;

# Logs na saida do container (visiveis com "docker logs agnello-proxy").
error_log  /dev/stderr warn;
# PID em /tmp, porque o sistema de arquivos do container e somente leitura.
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {

    # -----------------------------------------------------------------
    # BLOCO 1 - BASE
    # -----------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    # Nao revela a versao do nginx nas respostas.
    server_tokens off;

    # Corpo maximo: os servicos aceitam ate 10 KB. Acima disso, 413.
    client_max_body_size 16k;

    # Tempos limite curtos: nao deixa conexao pendurada para sempre.
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;

    # Limite de requisicoes por IP: 10 por segundo, com rajada de 20.
    # Excedeu: responde 429 (ajuda contra forca bruta e abuso).
    limit_req_zone $binary_remote_addr zone=geral:1m rate=10r/s;
    limit_req_status 429;

    # -----------------------------------------------------------------
    # BLOCO 2 - DNS E DESTINOS
    # Usa o NOSSO DNS (dnsmasq) para achar os servicos. Resolver em tempo
    # de requisicao faz o proxy subir mesmo se um servico ainda nao estiver
    # de pe (devolve 502 em vez de falhar na inicializacao).
    # -----------------------------------------------------------------
    resolver 172.28.0.2 valid=10s ipv6=off;

    map $host $auth_destino    { default http://auth.agnello.local:8081; }
    map $host $pedidos_destino { default http://pedidos.agnello.local:8082; }
    map $host $estoque_destino { default http://estoque.agnello.local:8083; }

    # -----------------------------------------------------------------
    # BLOCO 3 - PORTA 80 (HTTP): so redireciona para HTTPS
    # Excecao: /proxy-health, usado pelo healthcheck do Docker.
    # Fora do container o HTTPS esta publicado na 8443 (ver compose).
    # -----------------------------------------------------------------
    server {
        listen 80;
        server_name proxy.agnello.local localhost;

        location = /proxy-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host:8443$request_uri;
        }
    }

    # -----------------------------------------------------------------
    # BLOCO 4 - PORTA 443 (HTTPS)
    # -----------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name proxy.agnello.local localhost;

        # Certificado autoassinado (gerado em infra/tls, fora do Git).
        ssl_certificate     /etc/nginx/tls/proxy.crt;
        ssl_certificate_key /etc/nginx/tls/proxy.key;

        # So protocolos modernos: TLS 1.2 e 1.3.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:1m;
        ssl_session_timeout 10m;

        # Cabecalhos de seguranca em toda resposta.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        # HSTS curto (5 min) de proposito: o certificado e de laboratorio.
        add_header Strict-Transport-Security "max-age=300" always;

        limit_req zone=geral burst=20 nodelay;

        # Cabecalhos repassados aos servicos (inclui o Authorization).
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;

        # /auth/login -> auth recebe /login (o prefixo /auth e removido)
        location /auth/ {
            rewrite ^/auth/(.*)$ /$1 break;
            proxy_pass $auth_destino;
        }

        # /pedidos... -> pedidos recebe o caminho como veio
        location ~ ^/pedidos(/|$) {
            proxy_pass $pedidos_destino;
        }

        # /estoque... -> estoque recebe o caminho como veio
        location ~ ^/estoque(/|$) {
            proxy_pass $estoque_destino;
        }

        # Todo o resto: 404 em JSON (negar por padrao).
        location / {
            default_type application/json;
            return 404 '{"erro":"Rota nao encontrada."}';
        }
    }
}
